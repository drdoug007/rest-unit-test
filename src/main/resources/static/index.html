<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Unit Test Runner</title>
    <script src="lib/marked.min.js"></script>
    <script src="lib/html2pdf.bundle.min.js"></script>
    <script src="lib/html-docx.js"></script>
    <link id="hljs-style" rel="stylesheet" href="lib/highlight/styles/github.min.css">
    <script src="lib/highlight/highlight.min.js"></script>
    <script src="lib/highlight/languages/http.min.js"></script>
    <script src="lib/highlight/languages/javascript.min.js"></script>
    <script src="lib/highlight/languages/json.min.js"></script>
    <script src="lib/highlight/languages/sql.min.js"></script>
    <script src="lib/js-yaml.min.js"></script>
    <script src="lib/codemirror6.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Test Runner</h1>
        <div id="header-actions">
            <button id="source-btn" class="btn-source">View Source</button>
            <div id="export-dropdown" class="export-dropdown" style="display: none;">
                <button id="export-btn" class="btn-export" style="display: block;">Export</button>
                <div id="export-options" class="export-options">
                    <button id="export-pdf-btn">Export to PDF</button>
                    <button id="export-word-btn">Export to Word</button>
                </div>
            </div>
        </div>
        <div id="header-right">
            <div id="env-container" class="env-container">
                <select id="env-select" class="env-select">
                    <option value="">No Environment</option>
                </select>
                <button id="add-env-quick-btn" class="btn-manage-envs" title="Add Environment">+</button>
                <button id="manage-envs-btn" class="btn-manage-envs" title="Manage Environments">⚙️</button>
            </div>
            <div id="env-info"></div>
            <form action="/logout" method="post" style="display: inline;">
                <button type="submit" id="logout-btn" class="btn-logout">Logout</button>
            </form>
        </div>
    </header>

    <div class="container">
        <!-- Modal for Global Variables -->
        <div id="globals-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Global Variables for <span id="globals-test-name"></span></h2>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="modal-header-actions" style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                        <button id="toggle-globals-format-btn" class="btn-clone" style="font-size: 12px; padding: 5px 10px;">Switch to JSON</button>
                    </div>
                    <div id="globals-table-view">
                        <table id="globals-table" class="globals-table">
                            <thead>
                                <tr>
                                    <th>Key</th>
                                    <th>Value</th>
                                    <th style="width: 40px;"></th>
                                </tr>
                            </thead>
                            <tbody id="globals-tbody">
                                <!-- Rows will be added here -->
                            </tbody>
                        </table>
                        <button id="add-global-row-btn" class="btn-clone" style="margin-top: 10px; background-color: var(--success-color); width: 100%;">+ Add Variable</button>
                    </div>
                    <div id="globals-json-view" style="display: none; flex-direction: column;">
                        <textarea id="globals-json-textarea" class="env-json-textarea" placeholder='{ "key": "value" }' style="width: 100%; height: 250px; font-family: monospace; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); resize: vertical;"></textarea>
                        <button id="apply-globals-json-btn" class="btn-clone" style="margin-top: 10px; background-color: var(--primary-color); width: 100%;">Apply JSON Changes</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="save-globals-btn" class="btn-run" style="background-color: var(--primary-color);">Save Globals</button>
                </div>
            </div>
        </div>

        <!-- Modal for Environment Management -->
        <div id="env-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Manage Environments</h2>
                    <span class="close-env-modal close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="env-management-layout">
                        <div class="env-list-panel">
                            <ul id="env-list">
                                <!-- Environments will be listed here -->
                            </ul>
                            <button id="add-env-btn" class="btn-clone" style="width: 100%; margin-top: 10px;">+ New Environment</button>
                        </div>
                        <div id="env-edit-panel" class="env-edit-panel" style="display: none;">
                            <div class="env-edit-header">
                                <input type="text" id="env-name-input" placeholder="Environment Name" class="env-name-input">
                                <div class="env-edit-actions">
                                    <button id="toggle-env-format-btn" class="btn-clone" style="font-size: 12px; margin-right: 5px; padding: 5px 10px;">Switch to JSON</button>
                                    <button id="delete-env-btn" class="btn-delete" title="Delete Environment">🗑️</button>
                                </div>
                            </div>
                            
                            <div id="env-table-view">
                                <table class="globals-table">
                                    <thead>
                                        <tr>
                                            <th>Key</th>
                                            <th>Value</th>
                                            <th style="width: 40px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="env-vars-tbody">
                                        <!-- Environment variables will be added here -->
                                    </tbody>
                                </table>
                                <button id="add-env-var-btn" class="btn-clone" style="margin-top: 10px; background-color: var(--success-color); width: 100%;">+ Add Variable</button>
                            </div>

                            <div id="env-json-view" style="display: none; flex-direction: column;">
                                <textarea id="env-json-textarea" class="env-json-textarea" placeholder='{ "key": "value" }' style="width: 100%; height: 250px; font-family: monospace; margin-top: 10px; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); resize: vertical;"></textarea>
                                <button id="apply-env-json-btn" class="btn-clone" style="margin-top: 10px; background-color: var(--primary-color); width: 100%;">Apply JSON Changes</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="save-envs-btn" class="btn-run" style="background-color: var(--primary-color);">Save All</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <h3>
                Available Tests
                <div style="display: flex; gap: 5px;">
                    <button id="add-test-btn" class="btn-clone">+ New</button>
                    <button id="import-openapi-btn" class="btn-clone" style="background-color: #28a745;">Import OpenAPI</button>
                    <div id="import-options" class="import-options">
                        <button id="import-file-btn">From File</button>
                        <button id="import-url-btn">From URL</button>
                        <button id="import-paste-btn">Paste Spec</button>
                    </div>
                </div>
            </h3>
            <input type="file" id="openapi-file-input" style="display: none;" accept=".yaml,.yml,.json">
            <ul id="test-list">
                <li class="loading">Loading tests...</li>
            </ul>
        </div>
        <div class="main-content">
            <div id="report-content">
                <p>Select a test from the left to run it.</p>
            </div>
        </div>
        <div class="source-panel">
            <h3>
                Source Code
                <div>
                    <button id="clone-btn" class="btn-clone" style="display: none;">Clone</button>
                    <button id="globals-btn" class="btn-clone" style="display: none; background-color: var(--secondary-color);">Globals</button>
                    <button id="run-view-btn" class="btn-run" style="display: none; background-color: #28a745;">Run</button>
                    <button id="save-custom-btn" class="btn-run" style="display: none; background-color: #007bff;">Save</button>
                    <button id="run-custom-btn" class="btn-run" style="display: none;">Run</button>
                </div>
            </h3>
            <div id="source-content">
                <div class="source-view-wrapper">
                    <div id="source-gutter" class="source-gutter"></div>
                    <div id="source-pre-container">
                        <pre><code id="source-code" class="language-http"><span class="loading">Select a test to view its source.</span></code></pre>
                    </div>
                </div>
            </div>
            <div id="source-editor"></div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
