spring:
  application:
    name: rest-unit-test
  datasource:
    url: jdbc:postgresql://localhost:5432/cardealers
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8099


app:
  history-datasource:
    url: jdbc:h2:file:./test-history
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  environment:
    name: Development
    release: 1.0.0
    baseUrl: http://localhost:8080
  test-globals:
    username: ${TEST_USERNAME:user}
    password: ${TEST_PASSWORD:passwd}